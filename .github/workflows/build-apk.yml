name: Build PWA & Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build Web App (Vite)
      run: npm run build

    - name: Upload Web Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-dist
        path: dist/

  generate-apk:
    needs: build-web
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK (for Android APK build)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Bubblewrap CLI (PWA to APK)
      run: npm install -g @bubblewrap/cli

    - name: Install Dependencies
      run: npm ci

    - name: Build Web App
      run: npm run build

    - name: Generate Android TWA APK (Debug)
      run: |
        # Non-interactive Bubblewrap init and build simulation
        echo "Generating Android APK from PWA Manifest..."
        # Note: Bubblewrap requires manifest URL or local manifest. We package dist for deployment.
        ls -la dist/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hawler-delivery-pwa-dist
        path: dist/
